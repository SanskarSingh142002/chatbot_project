    <!-- Chatbot Popup Button -->
    <div class="chat-popup" id="chatPopup" onclick="openChat()">
        <img src="chatbot-icon.jpg" alt="Chat" class="chat-icon" />
    </div>

    <!-- Chatbot Modal -->
    <div class="chat-modal" id="chatModal">
        <div class="chat-header">
            <h3>Chat with us</h3>
            <span class="close-btn" onclick="closeChat()">&times;</span>
        </div>
        <div class="chat-body">
            <div id="chatMessages" class="chat-messages"></div>
            <textarea id="chatInput" placeholder="Type a message..." onkeydown="if(event.key === 'Enter'){ sendMessage(); }"></textarea>
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
